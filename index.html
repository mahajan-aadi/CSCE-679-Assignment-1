<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>HK Temperature Heatmap</title>

    <!-- D3.js library -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        /* -----------------------------------------------
           General page styles
        ----------------------------------------------- */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            color: #555;
            margin-top: 40px;
        }

        /* -----------------------------------------------
           Toggle buttons for max/min switch
        ----------------------------------------------- */
        .toggle-container {
            text-align: center;
            margin: 10px 0 20px 0;
        }

        .toggle-btn {
            padding: 8px 20px;
            margin: 0 5px;
            cursor: pointer;
            border: 2px solid #999;
            border-radius: 4px;
            background-color: #fff;
            font-size: 14px;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background-color: #e74c3c;
            color: white;
            border-color: #e74c3c;
        }

        /* -----------------------------------------------
           SVG containers
        ----------------------------------------------- */
        #level1-chart, #level2-chart {
            display: flex;
            justify-content: center;
            margin: 0 auto;
        }

        /* -----------------------------------------------
           Tooltip styles
        ----------------------------------------------- */
        .tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            pointer-events: none; /* so it doesn't block hover */
            opacity: 0;           /* hidden by default */
            transition: opacity 0.2s;
        }

        /* -----------------------------------------------
           Heatmap cell border
        ----------------------------------------------- */
        .cell {
            stroke: #fff;
            stroke-width: 1px;
        }

        /* -----------------------------------------------
           Axis text
        ----------------------------------------------- */
        .axis text {
            font-size: 12px;
        }

        /* -----------------------------------------------
           Legend styles
        ----------------------------------------------- */
        .legend-label {
            font-size: 11px;
        }

        /* -----------------------------------------------
           Divider between levels
        ----------------------------------------------- */
        .divider {
            border: none;
            border-top: 2px dashed #ccc;
            margin: 40px auto;
            width: 80%;
        }
    </style>
</head>
<body>

    <!-- ================================================
         LEVEL 1 SECTION
    ================================================ -->
    <h1>🌡️ Hong Kong Temperature Heatmap</h1>

    <h2>Level 1: Monthly Temperature by Year</h2>

    <!-- Toggle buttons to switch between max and min temperature -->
    <div class="toggle-container">
        <button class="toggle-btn active" id="btn-max"
                onclick="switchMode('max')">Max Temperature</button>
        <button class="toggle-btn" id="btn-min"
                onclick="switchMode('min')">Min Temperature</button>
    </div>

    <!-- Level 1 chart will be rendered here -->
    <div id="level1-chart"></div>

    <hr class="divider"/>

    <!-- ================================================
         LEVEL 2 SECTION
    ================================================ -->
    <h2>Level 2: Daily Temperature Changes (Last 10 Years)</h2>

    <!-- Level 2 chart will be rendered here -->
    <div id="level2-chart"></div>

    <!-- Tooltip element — shared by both levels -->
    <div class="tooltip" id="tooltip"></div>

    <!-- Load our visualization scripts -->
    <script src="/static/level1.js"></script>
    <script src="/static/level2.js"></script>

</body>
</html>
